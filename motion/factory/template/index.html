<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="base.css" />
    <style>
      @font-face { font-family: "Unbounded"; src: url("fonts/Unbounded-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "DM Sans"; src: url("fonts/DMSans.woff2") format("woff2"); font-weight: 100 1000; }
      /* Fenêtres d'interface (scènes recherche et demandes) */
      .bar { display: flex; align-items: center; gap: 12px; padding: 20px 26px; border-bottom: 2px solid #2c2870; font-size: 24px; color: #b4b1e0; margin: -34px -36px 4px; }
      .bar .d { width: 14px; height: 14px; border-radius: 50%; background: #4b4790; }
      .bar .t { margin-left: 10px; font-weight: 700; color: #f1f0ff; }
      .bar .c { margin-left: auto; color: #a5b4fc; font-family: "JetBrains Mono", monospace; }
      .item { display: flex; align-items: center; gap: 20px; padding: 20px 22px; background: #1d1a4a; border-radius: 20px; }
      .item.top { border: 3px solid #4f46e5; }
      .item .rk, .item .av { width: 56px; height: 56px; border-radius: 16px; background: #4f46e5; display: flex; align-items: center; justify-content: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; flex-shrink: 0; }
      .item .n { font-size: 31px; font-weight: 700; }
      .item .s { font-size: 24px; color: #b4b1e0; margin-top: 4px; }
      .item .badge { margin-left: auto; padding: 8px 16px; border-radius: 999px; background: #34d399; color: #0a0820; font-size: 22px; font-weight: 800; }
      .search { display: flex; align-items: center; gap: 16px; padding: 18px 26px; border: 3px solid #4b4790; border-radius: 999px; font-size: 36px; font-weight: 700; min-height: 84px; }
      .search .lens { color: #a5b4fc; }
      .gold { color: #fbbf24; }
      .vs-label { font-family: "JetBrains Mono", monospace; font-size: 26px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #b4b1e0; }
      .card.dim { opacity: 0.75; }
      .card.hot { border-color: #4f46e5; }
      .card.hot .vs-label { color: #a5b4fc; }
      .offer { border-color: #4f46e5; }
      .offer .row { font-size: 34px; align-items: flex-start; }
      .offer .row b { font-weight: 700; }
      .name { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 60px; letter-spacing: -0.02em; }
      .note { font-size: 24px; color: #8f8bc4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-width="1080" data-height="1920" data-start="0" data-duration="20">
      <div id="stars" data-layout-ignore></div>
      <div id="halo" data-layout-allow-overflow></div>
      <div id="ring" data-layout-allow-overflow></div>
      <div id="scenes"></div>
      <audio id="audio" data-start="0" data-duration="20" data-track-index="10" src="audio.wav" data-volume="1"></audio>
    </div>

    <script src="base.js"></script>
    <script src="data.js"></script>
    <script src="timing.js"></script>
    <script>
      // Reel piloté par données : data.js (textes écrits par Claude) + timing.js (calé sur la voix)
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const D = window.__PF_DATA, T = window.__PF_T.T, END = window.__PF_T.END;
      const { rich, esc } = PF;
      const K = PF.kit(tl, END);
      const size = (s, steps) => { const n = String(s || "").length; for (const [max, px] of steps) if (n <= max) return px; return steps[steps.length - 1][1]; };

      // ── Gabarits de scène : HTML (état final) + entrées ──
      const SCENES = {
        hook: {
          html: (s, i) => `${s.kicker ? `<div class="kicker" id="s${i}-k">${esc(s.kicker)}</div>` : ""}
            <div class="hook" id="s${i}-a" style="font-size:${size(s.text, [[28, 96], [48, 84], [70, 72], [999, 62]])}px">${rich(s.text)}</div>
            ${s.text2 ? `<div class="hook2" id="s${i}-b" style="font-size:${size(s.text2, [[30, 80], [55, 66], [999, 56]])}px">${rich(s.text2)}</div>` : ""}`,
          anim: (s, i, t, d) => {
            if (s.kicker) K.fade(`#s${i}-k`, t + 0.05);
            K.slam(`#s${i}-a`, t + 0.08);
            if (s.text2) tl.fromTo(`#s${i}-b`, { opacity: 0, y: 90, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: "back.out(1.8)" }, t + Math.min(1.1, d * 0.45));
          },
        },
        point: {
          html: (s, i) => `${s.kicker ? `<div class="kicker" id="s${i}-k">${esc(s.kicker)}</div>` : ""}
            ${s.num ? `<div class="num" id="s${i}-n">${esc(s.num)}</div>` : ""}
            <div class="title" id="s${i}-t" style="font-size:${size(s.title, [[24, 76], [44, 66], [999, 56]])}px">${rich(s.title)}</div>
            ${s.sub ? `<div class="sub" id="s${i}-s">${rich(s.sub)}</div>` : ""}`,
          anim: (s, i, t) => {
            if (s.kicker) tl.fromTo(`#s${i}-k`, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, t + 0.1);
            if (s.num) tl.fromTo(`#s${i}-n`, { opacity: 0, scale: 0.4, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, t + 0.14);
            K.pop(`#s${i}-t`, t + 0.22, "expo.out");
            if (s.sub) K.fade(`#s${i}-s`, t + 0.5);
          },
        },
        checklist: {
          html: (s, i) => `${s.kicker ? `<div class="kicker" id="s${i}-k">${esc(s.kicker)}</div>` : ""}
            <div class="title" id="s${i}-t" style="font-size:${size(s.title, [[24, 68], [44, 60], [999, 52]])}px">${rich(s.title)}</div>
            <div class="card" id="s${i}-c">${(s.items || []).map((it, j) => `<div class="row" id="s${i}-r${j}"><span class="${s.icon === "ko" ? "ko" : "ck"}">${s.icon === "ko" ? "✕" : "✓"}</span><span>${rich(it)}</span></div>`).join("")}</div>`,
          anim: (s, i, t) => {
            if (s.kicker) K.fade(`#s${i}-k`, t + 0.08);
            K.pop(`#s${i}-t`, t + 0.14, "expo.out");
            K.card(`#s${i}-c`, t + 0.3);
            (s.items || []).forEach((_, j) => {
              K.slide(`#s${i}-r${j}`, t + 0.6 + j * 0.3, -1);
              tl.fromTo(`#s${i}-r${j} > span:first-child`, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.25, ease: "back.out(2.6)" }, t + 0.7 + j * 0.3);
            });
          },
        },
        versus: {
          html: (s, i) => `<div class="title" id="s${i}-t" style="font-size:${size(s.title, [[24, 64], [44, 56], [999, 50]])}px">${rich(s.title)}</div>
            <div class="card dim" id="s${i}-l"><div class="vs-label">${esc(s.left?.label || "Avant")}</div>${(s.left?.items || []).map((it) => `<div class="row"><span class="ko">✕</span><span>${rich(it)}</span></div>`).join("")}</div>
            <div class="card hot" id="s${i}-r"><div class="vs-label">${esc(s.right?.label || "Après")}</div>${(s.right?.items || []).map((it) => `<div class="row"><span class="ck">✓</span><span>${rich(it)}</span></div>`).join("")}</div>`,
          anim: (s, i, t, d) => {
            K.pop(`#s${i}-t`, t + 0.1, "expo.out");
            tl.fromTo(`#s${i}-l`, { opacity: 0, x: -160 }, { opacity: 0.75, x: 0, duration: 0.32, ease: "power4.out" }, t + 0.35);
            tl.fromTo(`#s${i}-r`, { opacity: 0, x: 160, scale: 0.94 }, { opacity: 1, x: 0, scale: 1, duration: 0.36, ease: "back.out(1.6)" }, t + Math.min(1.4, d * 0.45));
          },
        },
        number: {
          html: (s, i) => `${s.kicker ? `<div class="kicker" id="s${i}-k">${esc(s.kicker)}</div>` : ""}
            <div class="num mono" id="s${i}-n" style="font-size:${String(s.prefix || "").length + String(s.value).length + String(s.suffix || "").length > 6 ? 120 : 170}px">${esc(s.prefix || "")}0${esc(s.suffix || "")}</div>
            <div class="title" id="s${i}-t" style="font-size:${size(s.label, [[24, 62], [44, 54], [999, 48]])}px">${rich(s.label)}</div>
            ${s.note ? `<div class="note" id="s${i}-o">${esc(s.note)}</div>` : ""}`,
          anim: (s, i, t) => {
            if (s.kicker) K.fade(`#s${i}-k`, t + 0.06);
            tl.fromTo(`#s${i}-n`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, t + 0.1);
            K.count(`#s${i}-n`, 0, Number(s.value) || 0, t + 0.15, 0.9, (v) => `${s.prefix || ""}${Math.round(v).toLocaleString("fr-FR")}${s.suffix || ""}`);
            K.pop(`#s${i}-t`, t + 0.45, "power3.out");
            if (s.note) K.fade(`#s${i}-o`, t + 0.8);
          },
        },
        search: {
          html: (s, i) => `<div class="title" id="s${i}-t" style="font-size:${size(s.title, [[24, 66], [44, 58], [999, 50]])}px">${rich(s.title)}</div>
            ${s.sub ? `<div class="sub" id="s${i}-s">${rich(s.sub)}</div>` : ""}
            <div class="card" id="s${i}-c">
              <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="t">Recherche</span></div>
              <div class="search"><span class="lens">⌕</span><span id="s${i}-q"></span></div>
              <div class="item top" id="s${i}-r0"><div class="rk">1</div><div><div class="n">${esc(s.business || "Ton entreprise")}</div><div class="s"><span class="gold">★★★★★</span> ${esc(s.rating || "4,9 · 37 avis")}</div></div></div>
              <div class="item" id="s${i}-r1"><div class="rk">2</div><div><div class="n">Concurrent A</div><div class="s">★★★★☆ 4,1 · 9 avis</div></div></div>
              <div class="item" id="s${i}-r2"><div class="rk">3</div><div><div class="n">Concurrent B</div><div class="s">Pas d'avis</div></div></div>
            </div>`,
          anim: (s, i, t) => {
            K.pop(`#s${i}-t`, t + 0.12, "expo.out");
            if (s.sub) K.fade(`#s${i}-s`, t + 0.3);
            K.card(`#s${i}-c`, t + 0.3);
            const q = String(s.query || ""), o = { n: 0 };
            tl.to(o, { n: q.length, duration: 0.6, ease: "none", onUpdate: () => { document.getElementById("s" + i + "-q").textContent = q.slice(0, Math.round(o.n)); } }, t + 0.55);
            tl.fromTo(`#s${i}-r0`, { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.7)" }, t + 1.25);
            tl.fromTo(`#s${i}-r1`, { opacity: 0, y: 30 }, { opacity: 0.55, y: 0, duration: 0.25, ease: "power3.out" }, t + 1.4);
            tl.fromTo(`#s${i}-r2`, { opacity: 0, y: 30 }, { opacity: 0.4, y: 0, duration: 0.25, ease: "power2.out" }, t + 1.5);
          },
        },
        leads: {
          html: (s, i) => `<div class="title" id="s${i}-t" style="font-size:${size(s.title, [[24, 66], [44, 58], [999, 50]])}px">${rich(s.title)}</div>
            ${s.sub ? `<div class="sub" id="s${i}-s">${rich(s.sub)}</div>` : ""}
            <div class="card" id="s${i}-c">
              <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="t">Demandes de devis</span><span class="c" id="s${i}-n">0</span></div>
              ${(s.items || []).slice(0, 3).map((l, j) => `<div class="item" id="s${i}-l${j}"><div class="av">${esc(String(l.name || "?").split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase())}</div><div><div class="n">${esc(l.name)}</div><div class="s">${esc(l.project)}${l.budget ? ` · ${esc(l.budget)}` : ""}</div></div><div class="badge">Qualifié</div></div>`).join("")}
            </div>`,
          anim: (s, i, t) => {
            K.pop(`#s${i}-t`, t + 0.12, "expo.out");
            if (s.sub) K.fade(`#s${i}-s`, t + 0.3);
            K.card(`#s${i}-c`, t + 0.3);
            (s.items || []).slice(0, 3).forEach((_, j) => K.slide(`#s${i}-l${j}`, t + 0.75 + j * 0.3, j % 2 ? 1 : -1));
            const total = Number(s.total) || 12;
            K.count(`#s${i}-n`, 0, total, t + 0.75, 1.3, (v) => { const n = Math.round(v); return `${n} demande${n > 1 ? "s" : ""}`; });
          },
        },
        cta: {
          html: (s, i) => s.mode === "offer"
            ? `<div class="mark" id="s${i}-m">P</div><div class="name" id="s${i}-na">PAYMENT FLOW</div>
               <div class="pill" id="s${i}-p">Commente <em>${esc(s.keyword || "DEVIS")}</em></div>
               <div class="card offer" id="s${i}-c"><div class="vs-label" style="color:#a5b4fc">Tu reçois gratuitement</div>
                 <div class="row" id="s${i}-o1"><span class="ck">✓</span><span>Un audit offert de ta visibilité, <b>avec Lomig</b></span></div>
                 <div class="row" id="s${i}-o2"><span class="ck">✓</span><span>Ton plan d'action pour <b>+15 demandes de devis</b> par mois</span></div>
                 <div class="small">100 % gratuit · sans engagement</div></div>`
            : `<div class="mark" id="s${i}-m">P</div>
               <div class="title" id="s${i}-t">Abonne-toi à <em>@paymentflow</em></div>
               <div class="sub" id="s${i}-s">${rich(s.line || "Chaque jour, une idée pour recevoir plus de demandes de devis")}</div>
               <div class="pill" id="s${i}-p">Commente <em>${esc(s.keyword || "DEVIS")}</em> : plan d'action offert</div>`,
          anim: (s, i, t) => {
            tl.fromTo(`#s${i}-m`, { opacity: 0, scale: 0.3, rotation: -25 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2.2)" }, t + 0.15);
            if (s.mode === "offer") {
              K.pop(`#s${i}-na`, t + 0.4, "expo.out");
              tl.fromTo(`#s${i}-p`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "elastic.out(1, 0.55)" }, t + 0.65);
              tl.fromTo(`#s${i}-c`, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, t + 1.1);
              K.slide(`#s${i}-o1`, t + 1.45, -1);
              K.slide(`#s${i}-o2`, t + 2.2, -1);
            } else {
              K.pop(`#s${i}-t`, t + 0.4, "expo.out");
              K.fade(`#s${i}-s`, t + 0.7);
              tl.fromTo(`#s${i}-p`, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "elastic.out(1, 0.55)" }, t + 1.1);
            }
            tl.to(`#s${i}-p`, { scale: 1.06, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, t + 2.8);
          },
        },
      };

      // ── Construction ──
      PF.stars();
      const box = document.getElementById("scenes");
      D.scenes.forEach((s, i) => {
        const el = document.createElement("div");
        el.id = `s${i}`;
        el.className = "scene" + (i === 0 ? " first" : "");
        el.innerHTML = `<div class="scene-content" data-layout-allow-overflow>${SCENES[s.type].html(s, i)}</div>`;
        box.appendChild(el);
      });

      // ── Animation ──
      K.ambient();
      D.scenes.forEach((s, i) => {
        const t = T[i], next = i + 1 < T.length ? T[i + 1] : END;
        if (i > 0) K.swap(`#s${i - 1}`, `#s${i}`, t);
        SCENES[s.type].anim(s, i, t, next - t);
        K.drift(`#s${i} .scene-content`, t + 0.3, next - t - 0.3);
      });
      K.fadeOut(`#s${D.scenes.length - 1} .scene-content`);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
